<script>
const cyberList = document.getElementById('cyber-list');
const networkList = document.getElementById('network-list');

const API = "https://api.rss2json.com/v1/api.json?rss_url=";

const cyberFeeds = [
  "https://www.cert.ssi.gouv.fr/feed/",
  "https://feeds.feedburner.com/TheHackersNews",
  "https://www.bleepingcomputer.com/feed/"
];

const networkFeeds = [
  "https://www.networkworld.com/index.rss",
  "https://www.lightreading.com/rss.xml",
  "https://feeds.feedburner.com/packetpushers"
];

async function translate(text) {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|fr`);
    const data = await res.json();
    return data.responseData.translatedText;
  } catch {
    return text;
  }
}

async function loadCategory(feeds, container, limit) {
  try {
    let allItems = [];

    for (let feed of feeds) {
      const res = await fetch(API + encodeURIComponent(feed));
      const data = await res.json();
      if (data.items) {
        allItems = allItems.concat(data.items);
      }
    }

    allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    const latest = allItems.slice(0, limit);

    const itemsHTML = await Promise.all(latest.map(async (item) => {

      let originalTitle = item.title;
      let displayTitle = originalTitle;
      let translated = false;

      if (!originalTitle.match(/[àâçéèêëîïôûùüÿñæœ]/i)) {
        const translatedText = await translate(originalTitle);
        if (translatedText !== originalTitle) {
          displayTitle = translatedText;
          translated = true;
        }
      }

      return `
        <li class="rss-item">
          <a href="${item.link}" target="_blank">${displayTitle}</a>
          <small>
            ${new Date(item.pubDate).toLocaleDateString('fr-FR')}
            ${translated ? `<br>traduit depuis l’anglais (${originalTitle})` : ""}
          </small>
        </li>
      `;
    }));

    container.innerHTML = itemsHTML.join('');

  } catch {
    container.innerHTML = "<li>Erreur de chargement.</li>";
  }
}

function loadAll() {
  loadCategory(cyberFeeds, cyberList, 5);
  loadCategory(networkFeeds, networkList, 5);
}

loadAll();
setInterval(loadAll, 600000);

</script>
