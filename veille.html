<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veille - Mon Portfolio</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .rss-list {
      list-style: none;
      padding: 0;
    }

    .rss-item {
      margin-bottom: 15px;
      padding: 10px;
      background: #1e1e1e;
      border-radius: 8px;
    }

    .rss-item a {
      color: #4da6ff;
      text-decoration: none;
      font-weight: bold;
    }

    .rss-item small {
      display: block;
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Mon Portfolio</h2>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="experiences.html">Expériences</a></li>
        <li><a href="projets.html">Projets</a></li>
        <li><a href="veille.html" class="active">Veille</a></li>
        <li><a href="tableau.html">Tableau Excel</a></li>
        <li><a href="CV.html">Mon CV</a></li>
      </ul>
    </nav>
  </div>

  <!-- CONTENU -->
  <div class="main-content">
    <header>
      <h1>Veille Cybersécurité</h1>
      <p>Articles récents sur les nouvelles menaces et vulnérabilités.</p>
    </header>

    <section class="rss-feed">
      <h2>🛡️ Actualités cybersécurité (temps quasi réel)</h2>
      <ul id="rss-list" class="rss-list">
        <li>Chargement des actualités...</li>
      </ul>
    </section>
  </div>

<script>
const rssList = document.getElementById('rss-list');

const feeds = [
  "https://www.cert.ssi.gouv.fr/feed/",
  "https://feeds.feedburner.com/TheHackersNews",
  "https://www.bleepingcomputer.com/feed/",
  "https://krebsonsecurity.com/feed/"
];

const API = "https://api.rss2json.com/v1/api.json?rss_url=";

// Traduction simple EN → FR
async function translate(text) {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|fr`);
    const data = await res.json();
    return data.responseData.translatedText;
  } catch {
    return text;
  }
}

async function loadFeeds() {
  try {
    let allItems = [];

    for (let feed of feeds) {
      const res = await fetch(API + encodeURIComponent(feed));
      const data = await res.json();
      if (data.items) {
        allItems = allItems.concat(data.items);
      }
    }

    // Trier par date (récent → ancien)
    allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    // Limite à 10 articles MAX
    const latest = allItems.slice(0, 10);

    const itemsHTML = await Promise.all(latest.map(async (item) => {

      let title = item.title;

      // Détection simple anglais → traduction
      if (!title.match(/[àâçéèêëîïôûùüÿñæœ]/i)) {
        title = await translate(title);
      }

      return `
        <li class="rss-item">
          <a href="${item.link}" target="_blank">${title}</a>
          <small>${new Date(item.pubDate).toLocaleDateString('fr-FR')}</small>
        </li>
      `;
    }));

    rssList.innerHTML = itemsHTML.join('');

  } catch (error) {
    rssList.innerHTML = "<li>Erreur de chargement des actualités.</li>";
  }
}

// Chargement initial
loadFeeds();

// Refresh auto toutes les 10 minutes (optionnel)
setInterval(loadFeeds, 600000);

</script>

</body>
</html>
